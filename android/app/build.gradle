plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zsus.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.zsus.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.22") {
            because("Avoid duplicate classes: unify Kotlin stdlib version")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("Avoid old jdk7 stdlib 1.6.21 pulled transitively")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("Avoid old jdk8 stdlib 1.6.21 pulled transitively")
        }
    }
}

