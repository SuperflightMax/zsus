<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZSUS Web Client</title>
    <link rel="stylesheet" href="web/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 id="storage-title">СКЛАД "ШВЕЙНА МАЙСТЕРНЯ"</h1>
        <p id="storage-subtitle" class="app__subtitle">ШІ оператор online.</p>
      </header>

      <section class="chat" aria-live="polite" aria-label="Chat messages">
        <ul id="messages" class="chat__messages"></ul>
      </section>

      <form id="chat-form" class="chat__form" autocomplete="off">
        <input
          id="message-input"
          type="text"
          placeholder="Напиши повідомлення…"
          aria-label="Message"
          required
        />
        <button id="send-button" type="submit">>></button>
      </form>

      <div id="mic-area" class="mic-area" hidden>
        <button id="mic-button" class="mic-button" type="button" aria-label="Hold to talk">
          🎤
        </button>
        <p class="mic-hint">утримуй і говори</p>
        <p id="mic-warning" class="mic-warning" hidden>
          Доступ до мікрофона заборонено. Дозвольте його в налаштуваннях браузера.
        </p>
      </div>
    </main>

    <script src="web/app.js"></script>
  </body>
</html>
