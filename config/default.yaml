app:
  name: "Storage Bot Core"
  version: "0.1.0"
storages:
  root_path: "./storages"
core:
  audit_enabled: true
  confidence_threshold: 0.7
  language_default: "uk"
cli:
  prompt_template: "bot{storage}> "
  json_prompt: "... "
  exit_commands:
    - "exit"
    - "quit"
  table_max_width: 24
  system_data_max_chars: 50
storage:
  backend: "sqlite"
  sqlite_filename: "storage.db"
logging:
  level: "INFO"
llm:
  enabled: true
  api_url: "https://api.openai.com/v1/chat/completions"
  model: "gpt-4o-mini"
  temperature: 0
  max_tokens: 300
  timeout_s: 20
  retry:
    max_retries: 1
    backoff_s: 1
media:
  store_images: true
  store_audio: true
  max_image_size_mb: 20
  max_audio_size_mb: 20
knowledge:
  items_path: "src/knowledge/items.yaml"
  synonyms_path: "src/knowledge/synonyms.yaml"
